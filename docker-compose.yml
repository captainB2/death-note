name: "death-note"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BOT_URL: "http://bot:8080"
    ports:
      - "3000:3000"
    restart: always

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      WEB_URL: "http://web:3000"
    depends_on:
      - web
    restart: always
